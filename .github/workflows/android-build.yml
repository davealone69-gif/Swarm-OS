name: Android Build

on:
  push:
    branches: [main, "copilot/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Vendor AGP + Assemble Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Maven (for vendor script)
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Vendor AGP into local Maven repo
        run: |
          chmod +x ./scripts/vendor-agp.sh
          ./scripts/vendor-agp.sh

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble Debug (online after vendor)
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble Debug offline (verify offline works)
        run: ./gradlew assembleDebug --offline --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
