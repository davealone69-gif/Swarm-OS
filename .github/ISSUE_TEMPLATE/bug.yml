name: Bug
description: Report a bug or issue in the ecosystem
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Related Agent / Project / Repo
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual
